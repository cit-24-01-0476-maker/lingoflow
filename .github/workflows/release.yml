name: Build & Release LingoFlow APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Repair and Prepare Android Project
        run: python scripts/prepare_android.py

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: |
          set +e
          flutter build apk --release -v > build_output.log 2>&1
          BUILD_STATUS=$?
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "==================== BUILD FAILED - FULL ERROR TAIL ===================="
            tail -n 250 build_output.log
            echo "==================== SEARCHING FOR FATAL/ERROR IN LOG ===================="
            grep -inE "(error:|fatal|exception|failure)" build_output.log | head -n 40
            exit $BUILD_STATUS
          fi
          echo "Build succeeded!"

      - name: Prepare Release Artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/lingoflow-v1.0.0.apk
          cp build/app/outputs/flutter-apk/app-release.apk dist/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk dist/lingoflow-latest.apk
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/lingoflow-v1.0.0.apk
            dist/app-release.apk
            dist/lingoflow-latest.apk
          name: "LingoFlow v1.0.0 Release"
          body: |
            ## LingoFlow - WhatsApp Message Translator v1.0.0
            - 🚀 Instant Singlish to Sinhala & English translation
            - 🔔 Live WhatsApp Notification Listener
            - 🔄 In-app automatic updates (OTA)
            - 🔒 100% Private, on-device processing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
