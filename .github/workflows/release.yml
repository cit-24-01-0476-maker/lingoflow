name: Build & Release LingoFlow APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Repair and Prepare Android Project
        run: python scripts/prepare_android.py

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Prepare Release Artifacts
        run: |
          mkdir -p dist
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="latest"
          fi
          cp build/app/outputs/flutter-apk/app-release.apk dist/singlishgo-${TAG_NAME}.apk
          cp build/app/outputs/flutter-apk/app-release.apk dist/singlishgo-latest.apk
          cp build/app/outputs/flutter-apk/app-release.apk dist/lingoflow-${TAG_NAME}.apk
          cp build/app/outputs/flutter-apk/app-release.apk dist/lingoflow-latest.apk
          cp build/app/outputs/flutter-apk/app-release.apk dist/app-release.apk
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
          name: "SinglishGo ${{ github.ref_name }} Release"
          body: |
            ## SinglishGo - WhatsApp Message Translator ${{ github.ref_name }}
            - 🚀 Rebranded to **SinglishGo** with iOS-style 3D Jelly App Icon!
            - 🌐 Trilingual Translation: Singlish, Sinhala, English & Tamil (தமிழ்)
            - 🫧 Assistive Touch Floating Bubble with live Tamil badge & cycling
            - 🔄 Real-time In-App Live Update with download progress & automatic installer
            - 🔒 100% Private, on-device processing & official Android notification APIs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
