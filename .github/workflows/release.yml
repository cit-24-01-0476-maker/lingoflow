name: Build & Release LingoFlow APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Repair and Prepare Android Project
        run: |
          mkdir -p /tmp/lingo_backup
          cp -r android/app/src /tmp/lingo_backup/
          rm -rf android
          flutter create --org com.lingoflow --project-name lingoflow --platforms android .
          mkdir -p android/app/src/main/kotlin/com/lingoflow/app
          cp -rf /tmp/lingo_backup/src/main/kotlin/com/lingoflow/app/* android/app/src/main/kotlin/com/lingoflow/app/
          cp /tmp/lingo_backup/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/file_paths.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-files-path name="my_downloads" path="Download" />
              <external-path name="external_files" path="." />
          </paths>
          XMLEOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/lingoflow-latest.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/lingoflow-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
