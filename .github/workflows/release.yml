name: Build & Release LingoFlow APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Backup Native Android Files
        run: |
          mkdir -p /tmp/lingo_kotlin
          cp -r android/app/src/main/kotlin /tmp/lingo_kotlin/
          cp android/app/src/main/AndroidManifest.xml /tmp/lingo_manifest.xml
          cp -r android/app/src/main/res /tmp/lingo_res

      - name: Rebuild Android Scaffold
        run: |
          rm -rf android
          flutter create --org com.lingoflow --project-name lingoflow --platforms android .

      - name: Restore Custom Kotlin + Manifest
        run: |
          mkdir -p android/app/src/main/kotlin/com/lingoflow/app
          cp -r /tmp/lingo_kotlin/kotlin/com/lingoflow/app/* android/app/src/main/kotlin/com/lingoflow/app/
          cp /tmp/lingo_manifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/xml
          cp /tmp/lingo_res/xml/file_paths.xml android/app/src/main/res/xml/file_paths.xml || true

      - name: Patch build.gradle - namespace + minSdk
        run: |
          # Ensure namespace is set (replaces flutter-created file with our own)
          cat > android/app/build.gradle << 'GRADLE_EOF'
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace "com.lingoflow.app"
              compileSdk = flutter.compileSdkVersion
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_11
                  targetCompatibility = JavaVersion.VERSION_11
              }

              kotlinOptions {
                  jvmTarget = JavaVersion.VERSION_11
              }

              defaultConfig {
                  applicationId = "com.lingoflow.app"
                  minSdk = 23
                  targetSdk = flutter.targetSdkVersion
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.debug
                  }
              }
          }

          flutter {
              source = "../.."
          }
          GRADLE_EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/lingoflow-latest.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/lingoflow-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
